name: holy_bible
description: "Selah — an advanced offline Bible companion (5 translations incl. original Hebrew/Greek, parallel reading, audio, search, plans, quiz, memory, notes, highlights)."
publish_to: 'none'

version: 3.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/Holy_Bible-main/bible/translations/kjv/all.min.json
    - lib/Holy_Bible-main/bible/translations/niv/all.min.json
    - lib/Holy_Bible-main/bible/translations/nlt/all.min.json
    - lib/Holy_Bible-main/bible/translations/nwt/all.min.json
    - lib/Holy_Bible-main/bible/translations/original/all.min.json
