name: Build APK

on:
  push:
    branches: [main, 'arena/**']
    paths-ignore:
      - 'ci/analyze.log'
      - 'ci/test.log'
  pull_request:
    paths-ignore:
      - 'ci/analyze.log'
      - 'ci/test.log'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Publish diagnostics (on failure)
        if: failure()
        run: |
          mkdir -p ci
          flutter analyze --no-fatal-infos > ci/analyze.log 2>&1 || true
          flutter test > ci/test.log 2>&1 || true
          git config user.name "ci-diagnostics"
          git config user.email "ci@local"
          git add -f ci/analyze.log ci/test.log
          git commit -q -m "ci: diagnostics" || true
          git push origin HEAD:arena/ci-diagnostics --force || true

      - name: Test
        run: flutter test

  build:
    name: Build release APKs
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Pub get
        run: flutter pub get

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selah-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: selah-appbundle
          path: |
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
