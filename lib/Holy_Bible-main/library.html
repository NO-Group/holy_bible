<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10131f">
<meta name="description" content="My Library — your bookmarks, highlights and notes, saved automatically.">
<title>My Library — Holy Bible</title>
<link rel="icon" type="image/svg+xml" href="app/icon.svg">
<link rel="manifest" href="app/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/css/style.css">
</head>
<body data-page="library">

<div class="page" id="pageContent">
  <div class="library-wrap">
    <div class="lib-tabs">
      <button class="lib-tab active" data-tab="bookmarks">Bookmarks</button>
      <button class="lib-tab" data-tab="highlights">Highlights</button>
      <button class="lib-tab" data-tab="notes">Notes</button>
    </div>
    <div id="libraryList"></div>
  </div>
</div>

<div id="shell"></div>

<script src="app/js/data.js"></script>
<script src="app/js/quiz.js"></script>
<script src="app/js/shell.js"></script>
<script src="app/js/library.js"></script>
</body>
</html>
