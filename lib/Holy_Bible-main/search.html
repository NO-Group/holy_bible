<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10131f">
<meta name="description" content="Search the Holy Bible — full-text search across every book, or jump straight to a reference like John 3:16.">
<title>Search — Holy Bible</title>
<link rel="icon" type="image/svg+xml" href="app/icon.svg">
<link rel="manifest" href="app/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/css/style.css">
</head>
<body data-page="search">

<div class="page" id="pageContent">
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" id="searchInput" placeholder="Search verses, or type e.g. John 3:16" autocomplete="off">
    </div>
    <div class="search-scope">
      <label><input type="radio" name="scope" value="all" checked> All books</label>
      <label><input type="radio" name="scope" value="ot"> Old Testament</label>
      <label><input type="radio" name="scope" value="nt"> New Testament</label>
    </div>
    <div class="search-status" id="searchStatus">Type at least 3 characters to search.</div>
    <div id="searchResults"></div>
  </div>
</div>

<div id="shell"></div>

<script src="app/js/data.js"></script>
<script src="app/js/quiz.js"></script>
<script src="app/js/shell.js"></script>
<script src="app/js/search.js"></script>
</body>
</html>
